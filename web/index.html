<title>Gráficos Mercurius</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600&display=swap">
<style>
/* Layout: coluna única de "exhibits" sobre o fundo do app; cartões meia-largura lado a lado no desktop. */
:root{
  --pg:#070c10; --card:#0e1318; --linha:rgba(255,255,255,.08); --tx:#f2f6f8; --tx2:#a6b3bd; --tx3:#76828b;
  --acento:#50ddd5; --codigo:#0a0f13;
  --f-display:"Outfit","Inter",ui-sans-serif,system-ui,sans-serif;
  --f-texto:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --pg:#f3f5f7; --card:#ffffff; --linha:#e3e8ec; --tx:#0e1a24; --tx2:#4a5761; --tx3:#7b8791;
  --acento:#138f86; --codigo:#f6f8fa; color-scheme:light;
}}
:root[data-theme="light"]{
  --pg:#f3f5f7; --card:#ffffff; --linha:#e3e8ec; --tx:#0e1a24; --tx2:#4a5761; --tx3:#7b8791;
  --acento:#138f86; --codigo:#f6f8fa; color-scheme:light;
}
:root{--mc-bg:var(--card)}
body{background:var(--pg);color:var(--tx);font-family:var(--f-texto);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px;padding-block:8px 4px}
.marca{font-family:var(--f-display);font-weight:600;letter-spacing:.16em;font-size:13px;color:var(--tx);display:flex;gap:10px;align-items:center}
.marca span{color:var(--tx3);font-weight:500}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0;letter-spacing:-.015em;text-wrap:balance}
.lead{margin:0;color:var(--tx2);max-width:68ch}
.lead code{font-family:var(--f-mono);font-size:12.5px;color:var(--acento)}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.cartao{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:18px 20px 12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.cartao.inteira{grid-column:1 / -1}
details{border-top:1px solid var(--linha);padding-top:8px}
summary{cursor:pointer;font-size:12px;color:var(--tx2);font-family:var(--f-mono);list-style:none;display:flex;gap:8px;align-items:center;width:max-content}
summary::-webkit-details-marker{display:none}
summary::before{content:"</>";color:var(--acento)}
summary:hover{color:var(--tx)}
summary:focus-visible{outline:2px solid var(--acento);outline-offset:3px;border-radius:3px}
pre{margin:10px 0 4px;background:var(--codigo);border:1px solid var(--linha);border-radius:8px;padding:12px 14px;overflow-x:auto;
  font-family:var(--f-mono);font-size:12px;line-height:1.6;color:var(--tx2)}
pre .k{color:var(--acento)}
.aviso{font-size:12px;color:var(--tx3)}
@media (max-width:820px){.grade{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="wrap">
  <header>
    <div class="marca">MERCURIUS <span>RESEARCH</span></div>
    <h1>Padrão de gráficos</h1>
    <p class="lead">Cada figura abaixo é desenhada ao vivo por <code>mercurius-charts.js</code>, a partir dos dados. Passe o mouse para ler os valores e abra <code>&lt;/&gt; Código</code> para ver a chamada exata que gera o gráfico.</p>
    <p class="aviso">Dados ilustrativos, aproximados. Não use para decisões de investimento.</p>
  </header>
  <main class="grade" id="grade"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="mercurius-charts.js"></script>
<script src="dados.js"></script>
<script>
const D = window.MC_DADOS;
const { F } = MC;
const FONTE = "Mercurius Research. Dados ilustrativos.";

const EXEMPLOS = [
  { inteira: true, gerar: (alvo) => {
    const ini = "2023-01-06";
    const base = (s) => { const i = s.findIndex(([d]) => d >= ini); return s.slice(i).map(([d, v]) => [d, (v / s[i][1]) * 100]); };
    const [plot] = MC.figura(alvo, {
      numero: 1, titulo: "BTC descolou do ETH desde a aprovação dos ETFs",
      subtitulo: "Preço indexado, base 100 = jan/23", fonte: FONTE,
    });
    MC.linhas(plot, {
      series: { BTC: base(D.precos.BTC), ETH: base(D.precos.ETH) },
      cores: { BTC: "s1", ETH: "s2" }, area: true, base: 100, passo: "semestre",
      eventos: [{ x: "2024-01-11", texto: "ETFs spot" }, { x: "2024-04-19", texto: "Halving" }],
      fmt: (v) => F.num(v),
    });
  }},
  { inteira: true, gerar: (alvo) => {
    const [plot] = MC.figura(alvo, {
      numero: 2, titulo: "Cada halving antecedeu uma nova máxima do bitcoin",
      subtitulo: "Preço em US$, escala logarítmica, semanal", fonte: FONTE,
    });
    MC.linhas(plot, {
      series: { BTC: D.precos.BTC, ETH: D.precos.ETH }, log: true, altura: 360,
      periodos: [{ de: "2017-12-15", ate: "2018-12-15", texto: "Bear market" },
                 { de: "2021-11-10", ate: "2022-11-21", texto: "Bear market" }],
      eventos: [{ x: "2020-05-11", texto: "Halving" }, { x: "2024-04-20", texto: "Halving" }],
      destaque: { serie: "BTC", texto: (v) => `Máxima: US$ ${F.mil(v)}` },
      fmtTag: (v) => F.num(v > 1000 ? Math.round(v / 100) * 100 : v),
    });
  }},
  { inteira: true, gerar: (alvo) => {
    const [fluxo, acum] = MC.figura(alvo, {
      numero: 3, titulo: "ETFs de bitcoin: entradas persistentes, apesar das saídas do GBTC",
      subtitulo: "Desde o lançamento dos ETFs spot nos EUA, jan/24–dez/25", fonte: FONTE,
      nota: "Fluxo líquido = criações menos resgates.",
      paineis: [{ titulo: "Fluxo líquido semanal", unidade: "US$ bilhões" },
                { titulo: "Fluxo acumulado por emissor", unidade: "US$ bilhões" }],
    });
    MC.barrasTempo(fluxo, { dados: D.etf_semanal, fmt: (v) => F.num(v, 1), fmtEixo: (v) => F.num(v), altura: 280 });
    MC.linhas(acum, {
      series: D.etf_acumulado, altura: 280, passo: "semestre",
      cores: { IBIT: "s1", FBTC: "s2", Outros: "s6", GBTC: "neg" }, fmt: (v) => F.num(v, 0),
    });
  }},
  { inteira: true, gerar: (alvo) => {
    const s = D.stablecoins.series;
    const total = D.stablecoins.datas.map((_, i) => Object.values(s).reduce((a, x) => a + x[i], 0));
    const n = total.length - 1;
    const [plot] = MC.figura(alvo, {
      numero: 4, titulo: "Oferta de stablecoins atingiu recorde, liderada pelo USDT",
      subtitulo: "Capitalização por emissor, US$ bilhões, fim do mês", fonte: FONTE,
    });
    MC.areaEmpilhada(plot, {
      datas: D.stablecoins.datas, series: s,
      cores: { USDT: "s1", USDC: "s2", "USDS/DAI": "s3", Outras: "outros" },
      caixa: [[F.num(total[n]), "US$ bi em circulação"],
              [F.pct(total[n] / total[n - 12] - 1, 0, true), "em 12 meses"],
              [F.pct(s.USDT[n] / total[n]), "fatia do USDT"]],
    });
  }},
  { inteira: true, gerar: (alvo) => {
    const [plot] = MC.figura(alvo, {
      numero: 5, titulo: "Retorno por unidade de risco: BTC se aproxima dos ativos tradicionais",
      subtitulo: "Retorno anualizado × volatilidade anualizada, 3 anos; área = valor de mercado", fonte: FONTE,
    });
    MC.dispersao(plot, {
      pontos: D.risco_retorno.map((r) => ({ nome: r.ativo, x: r.vol, y: r.ret, tamanho: r.mcap, grupo: r.grupo })),
      cores: { Cripto: "s1", Tradicional: "s6" }, dominioY: [-0.1, 0.65], tituloX: "Volatilidade anualizada →",
      fmtTamanho: (v) => `US$ ${F.num(v)} bi`, rotuloTamanho: "Valor de mercado",
    });
  }},
  { inteira: true, gerar: (alvo) => {
    const [plot] = MC.figura(alvo, {
      numero: 6, titulo: "Cenário-base aponta BTC perto de US$ 140 mil no fim de 2027",
      subtitulo: "Preço em US$, escala log; bandas = intervalos de probabilidade", fonte: FONTE,
      nota: "Distribuição lognormal com volatilidade de 55% a.a.",
    });
    MC.leque(plot, { historico: D.leque.historico, quantis: D.leque.quantis, log: true, fmt: (v) => F.mil(v) });
  }},
  { inteira: true, gerar: (alvo) => {
    const [plot] = MC.figura(alvo, {
      numero: 7, titulo: "Retornos mensais do bitcoin: o quarto trimestre concentra os ganhos",
      subtitulo: "Variação % no mês, preço em US$", fonte: FONTE,
    });
    MC.calendario(plot, { ...D.calendario, limite: 0.35 });
  }},
  { inteira: false, gerar: (alvo) => {
    const [plot] = MC.figura(alvo, {
      numero: 8, titulo: "Carteira-modelo superou o benchmark, puxada por BTC",
      subtitulo: "Contribuição para o retorno em 2025, p.p.", fonte: FONTE,
    });
    MC.cascata(plot, {
      inicio: ["Benchmark", 12.0],
      passos: [["BTC", 6.2], ["ETH", 2.1], ["Altcoins", -2.4], ["Hedge", -0.9], ["Staking", 1.3], ["Custos", -0.6]],
      fim: "Carteira", altura: 300,
    });
  }},
  { inteira: false, gerar: (alvo) => {
    const [plot] = MC.figura(alvo, {
      numero: 9, titulo: "Só metade das 12 maiores bateu o Nasdaq no ano",
      subtitulo: "Retorno no ano em US$, %", fonte: FONTE,
    });
    MC.barrasHorizontais(plot, {
      dados: [["BTC", .42], ["XRP", .31], ["SUI", .22], ["ETH", .18], ["TON", .14], ["TRX", .11],
              ["BNB", .09], ["LINK", .05], ["ADA", -.08], ["SOL", -.12], ["AVAX", -.27], ["DOGE", -.35]],
      referencia: [0.17, "Nasdaq +17%"], rotulo: "Retorno",
    });
  }},
];

function dedent(fn) {
  const linhas = fn.toString().split("\n").slice(1, -1);
  const ind = Math.min(...linhas.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
  return linhas.map((l) => l.slice(ind)).join("\n");
}
function realce(s) {
  const esc = s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  return esc.replace(/\b(MC\.\w+|const|return)\b/g, '<span class="k">$1</span>');
}

const grade = document.getElementById("grade");
EXEMPLOS.forEach((ex, i) => {
  const c = document.createElement("section");
  c.className = "cartao" + (ex.inteira ? " inteira" : "");
  const alvo = document.createElement("div");
  const det = document.createElement("details");
  det.innerHTML = `<summary>Código</summary><pre><code>${realce(dedent(ex.gerar))}</code></pre>`;
  c.append(alvo, det);
  grade.append(c);
  try { ex.gerar(alvo); } catch (e) { alvo.textContent = "Erro ao desenhar: " + e.message; console.error(e); }
});
</script>
